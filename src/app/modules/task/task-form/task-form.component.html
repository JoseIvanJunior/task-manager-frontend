<!-- task-form.component.html -->
<mat-card>
  <mat-card-header>
    <mat-card-title>
      {{ isEditMode ? 'Editar Tarefa' : 'Nova Tarefa' }}
    </mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <!-- Título -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Título *</mat-label>
        <input matInput formControlName="title" placeholder="Digite o título">
        <mat-error *ngIf="title?.hasError('required')">
          Título é obrigatório
        </mat-error>
        <mat-error *ngIf="title?.hasError('minlength')">
          Mínimo 3 caracteres
        </mat-error>
      </mat-form-field>

      <!-- Descrição -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descrição</mat-label>
        <textarea matInput formControlName="description" rows="3" placeholder="Digite a descrição"></textarea>
      </mat-form-field>

      <!-- Responsável -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Responsável</mat-label>
        <input matInput formControlName="responsible" placeholder="Nome do responsável">
      </mat-form-field>

      <div class="row">
        <!-- Prioridade -->
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Prioridade *</mat-label>
          <mat-select formControlName="priority">
            <mat-option *ngFor="let p of priorities" [value]="p.value">
              {{ p.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="priority?.hasError('required')">
            Prioridade é obrigatória
          </mat-error>
        </mat-form-field>

        <!-- Status -->
        <mat-form-field appearance="outline" class="half-width">
          <mat-label>Status *</mat-label>
          <mat-select formControlName="status">
            <mat-option *ngFor="let s of statuses" [value]="s.value">
              {{ s.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="status?.hasError('required')">
            Status é obrigatório
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Deadline -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Prazo *</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="deadline">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="deadline?.hasError('required')">
          Prazo é obrigatório
        </mat-error>
      </mat-form-field>

      <!-- Botões -->
      <div class="actions">
        <button mat-button type="button" (click)="cancel()">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="taskForm.invalid || isLoading">
          <span *ngIf="isLoading">Salvando...</span>
          <span *ngIf="!isLoading && !isEditMode">Criar</span>
          <span *ngIf="!isLoading && isEditMode">Atualizar</span>
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
