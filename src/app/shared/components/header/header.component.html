<!-- src/app/shared/components/header/header.component.html -->
<mat-toolbar color="primary">
  <div class="container">
    <div class="left-section">
      <button mat-icon-button [routerLink]="['/']" class="logo-button">
        <mat-icon>checklist</mat-icon>
      </button>
      <span class="app-title">Task Manager</span>

      <nav class="nav-links">
        <button mat-button *ngIf="authService.isAuthenticated()" [routerLink]="['/tasks']">
          Tarefas
        </button>
        <button mat-button *ngIf="authService.isAdmin()" [routerLink]="['/admin']">
          Admin
        </button>
      </nav>
    </div>

    <div class="right-section">
      <ng-container *ngIf="authService.isAuthenticated(); else notAuthenticated">
        <button mat-button [matMenuTriggerFor]="userMenu">
          <mat-icon>person</mat-icon>
          {{ currentUser$ | async }}
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="goToProfile()">
            <mat-icon>account_circle</mat-icon>
            Meu Perfil
          </button>
          <button mat-menu-item (click)="goToTasks()">
            <mat-icon>list_alt</mat-icon>
            Minhas Tarefas
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            Sair
          </button>
        </mat-menu>
      </ng-container>

      <ng-template #notAuthenticated>
        <button mat-button [routerLink]="['/login']">
          Login
        </button>
        <button mat-button [routerLink]="['/register']" color="accent">
          Registrar
        </button>
      </ng-template>
    </div>
  </div>
</mat-toolbar>

<style>
  .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 0 16px;
  }

  .left-section {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-button {
    margin-right: 8px;
  }

  .app-title {
    font-size: 1.2rem;
    font-weight: 500;
  }

  .nav-links {
    display: flex;
    gap: 8px;
    margin-left: 24px;
  }

  .right-section {
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
