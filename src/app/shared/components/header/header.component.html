<!-- src/app/shared/components/header/header.component.html -->
<mat-toolbar color="primary" class="header-toolbar">
  <div class="header-container">
    <!-- Logo e Nome -->
    <div class="logo-section" (click)="goToTasks()">
      <mat-icon class="logo-icon">task_alt</mat-icon>
      <span class="app-name">Task Manager</span>
    </div>

    <!-- Menu de Navegação -->
    <div class="nav-section" *ngIf="isLoggedIn">
      <button mat-button routerLink="/tasks" routerLinkActive="active">
        <mat-icon>list_alt</mat-icon>
        <span>Tarefas</span>
      </button>
      
      <button mat-button routerLink="/tasks/new" routerLinkActive="active">
        <mat-icon>add_task</mat-icon>
        <span>Nova Tarefa</span>
      </button>
    </div>

    <!-- Usuário e Menu -->
    <div class="user-section">
      <div *ngIf="isLoggedIn; else loginButtons">
        <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
          <mat-icon class="user-icon">account_circle</mat-icon>
          <span class="username">{{ username }}</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" xPosition="before">
          <button mat-menu-item disabled>
            <mat-icon>person</mat-icon>
            <span>{{ username }}</span>
            <span class="user-role" *ngIf="isAdmin">(Admin)</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item routerLink="/profile">
            <mat-icon>settings</mat-icon>
            <span>Meu Perfil</span>
          </button>
          <button mat-menu-item *ngIf="isAdmin" routerLink="/admin">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Painel Admin</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()" class="logout-btn">
            <mat-icon color="warn">exit_to_app</mat-icon>
            <span>Sair</span>
          </button>
        </mat-menu>
      </div>

      <ng-template #loginButtons>
        <button mat-button (click)="goToLogin()" class="login-btn">
          <mat-icon>login</mat-icon>
          <span>Entrar</span>
        </button>
      </ng-template>
    </div>
  </div>
</mat-toolbar>
